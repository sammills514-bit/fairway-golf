<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fairway Golf</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fairway">
  <meta name="theme-color" content="#1a472a">
  <link rel="apple-touch-icon" href="icon.svg">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HUD Top Bar -->
  <div id="hud">
    <div class="hud-panel">
      <div class="hud-label">Hole</div>
      <div class="hud-value" id="hud-hole">1</div>
    </div>
    <div class="hud-panel">
      <div class="hud-label">Par</div>
      <div class="hud-value" id="hud-par">4</div>
    </div>
    <div class="hud-panel">
      <div class="hud-label">Strokes</div>
      <div class="hud-value" id="hud-strokes">0</div>
    </div>
    <div class="hud-panel">
      <div class="hud-label">Distance</div>
      <div class="hud-value" id="hud-dist">290y</div>
    </div>
    <div class="hud-panel">
      <div class="hud-label">Club</div>
      <div class="hud-value" id="hud-club">Driver</div>
    </div>
  </div>

  <!-- Shot message overlay -->
  <div id="shot-message"></div>

  <!-- Play again (shown after hole-out) -->
  <button id="play-again-btn" style="display:none">Play Again</button>

  <!-- Hint text -->
  <div id="hint">Swipe left/right to aim &nbsp;·&nbsp; Drag down to shoot</div>

  <!-- Power indicator -->
  <div id="power-container">
    <div id="power-label">Power</div>
    <div id="power-track">
      <div id="power-fill"></div>
    </div>
  </div>

  <!-- Club selector -->
  <div id="club-selector">
    <button class="club-btn active" data-club="driver">
      <span class="club-short">DR</span>
      <span class="club-name">Driver</span>
    </button>
    <button class="club-btn" data-club="iron7">
      <span class="club-short">7i</span>
      <span class="club-name">7 Iron</span>
    </button>
    <button class="club-btn" data-club="wedge">
      <span class="club-short">PW</span>
      <span class="club-name">Wedge</span>
    </button>
    <button class="club-btn" data-club="putter">
      <span class="club-short">PT</span>
      <span class="club-name">Putter</span>
    </button>
  </div>

  <!-- Menu trigger -->
  <button id="menu-btn" aria-label="Menu">&#9776;</button>

  <!-- Menu overlay + panel -->
  <div id="menu-overlay">
    <div id="menu-panel">
      <div id="menu-title">&#9971; Fairway Golf</div>
      <div id="menu-version">v4</div>
      <div id="menu-divider"></div>
      <button class="menu-item" id="menu-update">&#8635; Check for Update</button>
      <button class="menu-item" id="menu-newgame">&#9654; New Game</button>
      <div id="menu-divider"></div>
      <button class="menu-item" id="menu-close">&#10005; Close</button>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/clubs.js"></script>
  <script src="js/course.js"></script>
  <script src="js/ball.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/main.js"></script>
  <script>
    // ── Service worker ─────────────────────────────────────
    let swReg = null;
    let reloading = false;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!reloading) { reloading = true; window.location.reload(); }
      });
      navigator.serviceWorker.register('./sw.js')
        .then(reg => { swReg = reg; })
        .catch(() => {});
    }

    // ── Menu ───────────────────────────────────────────────
    const overlay  = document.getElementById('menu-overlay');
    const menuBtn  = document.getElementById('menu-btn');
    const updateBtn = document.getElementById('menu-update');
    const newGameBtn = document.getElementById('menu-newgame');
    const closeBtn  = document.getElementById('menu-close');

    function openMenu()  { overlay.style.display = 'flex'; }
    function closeMenu() { overlay.style.display = 'none'; }

    menuBtn.addEventListener('click',  openMenu);
    menuBtn.addEventListener('touchstart', e => { e.stopPropagation(); e.preventDefault(); openMenu(); });

    closeBtn.addEventListener('click', closeMenu);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeMenu(); });

    updateBtn.addEventListener('click', () => {
      updateBtn.textContent = '↻ Checking…';
      updateBtn.disabled = true;
      const finish = () => setTimeout(() => window.location.reload(), 400);
      if (swReg) swReg.update().then(finish).catch(finish);
      else finish();
    });

    newGameBtn.addEventListener('click', () => {
      closeMenu();
      if (window.gameReset) window.gameReset();
    });

    // Stop menu button triggering canvas drag
    ['touchstart','touchend','touchmove'].forEach(evt => {
      menuBtn.addEventListener(evt, e => e.stopPropagation());
      overlay.addEventListener(evt, e => e.stopPropagation());
    });
  </script>
</body>
</html>
