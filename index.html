<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fairway Golf</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fairway">
  <meta name="theme-color" content="#1a472a">
  <link rel="apple-touch-icon" href="icon.svg">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HUD Top Bar -->
  <div id="hud">
    <div class="hud-panel">
      <div class="hud-label">Hole</div>
      <div class="hud-value" id="hud-hole">1</div>
    </div>
    <div class="hud-panel">
      <div class="hud-label">Par</div>
      <div class="hud-value" id="hud-par">4</div>
    </div>
    <div class="hud-panel">
      <div class="hud-label">Strokes</div>
      <div class="hud-value" id="hud-strokes">0</div>
    </div>
    <div class="hud-panel">
      <div class="hud-label">Distance</div>
      <div class="hud-value" id="hud-dist">290y</div>
    </div>
    <div class="hud-panel">
      <div class="hud-label">Club</div>
      <div class="hud-value" id="hud-club">Driver</div>
    </div>
  </div>

  <!-- Shot message overlay -->
  <div id="shot-message"></div>

  <!-- Play again (shown after hole-out) -->
  <button id="play-again-btn" style="display:none">Play Again</button>

  <!-- Hint text -->
  <div id="hint">Swipe left/right to aim &nbsp;·&nbsp; Drag down to shoot</div>

  <!-- Power indicator -->
  <div id="power-container">
    <div id="power-label">Power</div>
    <div id="power-track">
      <div id="power-fill"></div>
    </div>
  </div>

  <!-- Club selector -->
  <div id="club-selector">
    <button class="club-btn active" data-club="driver">
      <span class="club-short">DR</span>
      <span class="club-name">Driver</span>
    </button>
    <button class="club-btn" data-club="iron7">
      <span class="club-short">7i</span>
      <span class="club-name">7 Iron</span>
    </button>
    <button class="club-btn" data-club="wedge">
      <span class="club-short">PW</span>
      <span class="club-name">Wedge</span>
    </button>
    <button class="club-btn" data-club="putter">
      <span class="club-short">PT</span>
      <span class="club-name">Putter</span>
    </button>
  </div>

  <!-- Version badge — tap to force-update -->
  <div id="version">↻ v3</div>

  <canvas id="game-canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/clubs.js"></script>
  <script src="js/course.js"></script>
  <script src="js/ball.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/main.js"></script>
  <script>
    // ── Service worker + update logic ──────────────────────
    let swReg = null;
    let reloading = false;

    if ('serviceWorker' in navigator) {
      // Auto-reload when a new SW activates (picks up pushed changes)
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!reloading) { reloading = true; window.location.reload(); }
      });

      navigator.serviceWorker.register('./sw.js')
        .then(reg => { swReg = reg; })
        .catch(() => {});
    }

    // Version badge: tap to force a SW update check + hard reload
    document.getElementById('version').addEventListener('click', () => {
      const badge = document.getElementById('version');
      badge.textContent = '↻ checking…';
      if (swReg) {
        swReg.update()          // ask SW to re-fetch sw.js from network
          .then(() => {
            // If SW didn't change, just do a hard reload anyway
            setTimeout(() => window.location.reload(), 400);
          })
          .catch(() => window.location.reload());
      } else {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
